# ====================================================================================
# BOOST LUMINEUX - 3 SEC ROUGE / 1 SEC ÉTEINT
# ====================================================================================

# ------------------------------------------------------------------------------------
# BOOST - Mode Manuel (3 SEC ROUGE / 1 SEC ÉTEINT - FIXE)
# ------------------------------------------------------------------------------------
- alias: Boost - Mode Manuel Activé
  description: 3 secondes ROUGE, 1 seconde ÉTEINT, cycle infini
  mode: restart
  
  trigger:
    - platform: state
      entity_id: input_boolean.boost_manual_override
      to: "on"
  
  action:
    # Attend que l'automatisation de nettoyage soit terminée
    - delay:
        milliseconds: 900
    
    - service: input_boolean.turn_on
      entity_id: input_boolean.boost_running
    
    # Boucle de clignotement infinie
    - repeat:
        while:
          - condition: state
            entity_id: input_boolean.boost_manual_override
            state: "on"
        sequence:
          # ========== PHASE 1 : 3 SECONDES ROUGE ==========
          - service: light.turn_on
            target:
              entity_id:
                - light.zone_1
                - light.zone_2
                - light.zone_3
                - light.zone_4
                - light.tzb210_1alquo2j_ts0505b_2
                - light.tzb210_1alquo2j_ts0505b_3
                - light.tzb210_1alquo2j_ts0505b_4
                - light.tzb210_1alquo2j_ts0505b_5
                - light.tzb210_1alquo2j_ts0505b_6
                - light.tzb210_1alquo2j_ts0505b_7
                - light.tzb210_1alquo2j_ts0505b_8
                - light.tzb210_1alquo2j_ts0505b_9
                - light.tzb210_1alquo2j_ts0505b_10
                - light.tzb210_1alquo2j_ts0505b_11
                - light.tzb210_1alquo2j_ts0505b_12
                - light.tzb210_1alquo2j_ts0505b_13
                - light.tzb210_1alquo2j_ts0505b_14
                - light.ruban_led
                - light.gros_spot_1
                - light.gros_spot_2
                - light.gros_spot_3
                - light.gros_spot_4
            data:
              brightness: 255
              rgb_color: [255, 0, 0]
              transition: 0
          
          # Attente 3 secondes (ROUGE ALLUMÉ)
          - delay:
              seconds: 3
          
          # ========== PHASE 2 : 1 SECONDE ÉTEINT ==========
          - service: light.turn_off
            target:
              entity_id:
                - light.zone_1
                - light.zone_2
                - light.zone_3
                - light.zone_4
                - light.tzb210_1alquo2j_ts0505b_2
                - light.tzb210_1alquo2j_ts0505b_3
                - light.tzb210_1alquo2j_ts0505b_4
                - light.tzb210_1alquo2j_ts0505b_5
                - light.tzb210_1alquo2j_ts0505b_6
                - light.tzb210_1alquo2j_ts0505b_7
                - light.tzb210_1alquo2j_ts0505b_8
                - light.tzb210_1alquo2j_ts0505b_9
                - light.tzb210_1alquo2j_ts0505b_10
                - light.tzb210_1alquo2j_ts0505b_11
                - light.tzb210_1alquo2j_ts0505b_12
                - light.tzb210_1alquo2j_ts0505b_13
                - light.tzb210_1alquo2j_ts0505b_14
                - light.ruban_led
                - light.gros_spot_1
                - light.gros_spot_2
                - light.gros_spot_3
                - light.gros_spot_4
            data:
              transition: 0
          
          # Attente 1 seconde (ÉTEINT)
          - delay:
              seconds: 1
    
    # Arrête le boost
    - service: input_boolean.turn_off
      entity_id: input_boolean.boost_running

# ------------------------------------------------------------------------------------
# BOOST - Mode Manuel Désactivé
# ------------------------------------------------------------------------------------
- alias: Boost - Mode Manuel Désactivé
  description: Arrête les flashs immédiatement
  mode: single

  trigger:
    - platform: state
      entity_id: input_boolean.boost_manual_override
      to: "off"

  action:
    - service: input_boolean.turn_off
      entity_id: input_boolean.boost_running

# ------------------------------------------------------------------------------------
# BOOST - Planification Automatique (utilise intervalle configuré)
# ------------------------------------------------------------------------------------
- alias: Boost - Planification Automatique
  description: Lance le boost à l'heure planifiée avec intervalle configurable
  mode: restart

  trigger:
    - platform: time
      at: input_datetime.boost_time

  condition:
    - condition: state
      entity_id: input_boolean.boost_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.boost_manual_override
      state: "off"

  action:
    - service: input_boolean.turn_on
      entity_id: input_boolean.boost_running

    - repeat:
        while:
          - condition: state
            entity_id: input_boolean.boost_running
            state: "on"
          - condition: state
            entity_id: input_boolean.boost_manual_override
            state: "off"
          - condition: template
            value_template: >
              {% set start = states('input_datetime.boost_time') %}
              {% set duration = states('input_number.boost_duration_min') | int %}
              {% set now_time = now() %}
              {% set start_time = today_at(start) %}
              {% set end_time = start_time + timedelta(minutes=duration) %}
              {{ now_time < end_time }}
        sequence:
          # ROUGE ON
          - service: light.turn_on
            target:
              entity_id:
                - light.zone_1
                - light.zone_2
                - light.zone_3
                - light.zone_4
                - light.tzb210_1alquo2j_ts0505b_2
                - light.tzb210_1alquo2j_ts0505b_3
                - light.tzb210_1alquo2j_ts0505b_4
                - light.tzb210_1alquo2j_ts0505b_5
                - light.tzb210_1alquo2j_ts0505b_6
                - light.tzb210_1alquo2j_ts0505b_7
                - light.tzb210_1alquo2j_ts0505b_8
                - light.tzb210_1alquo2j_ts0505b_9
                - light.tzb210_1alquo2j_ts0505b_10
                - light.tzb210_1alquo2j_ts0505b_11
                - light.tzb210_1alquo2j_ts0505b_12
                - light.tzb210_1alquo2j_ts0505b_13
                - light.tzb210_1alquo2j_ts0505b_14
                - light.ruban_led
                - light.gros_spot_1
                - light.gros_spot_2
                - light.gros_spot_3
                - light.gros_spot_4
            data:
              brightness: 255
              rgb_color: [255, 0, 0]
              transition: 0

          # Attente ON (utilise l'intervalle configuré)
          - delay:
              seconds: "{{ states('input_number.boost_interval_sec') | float }}"

          # ÉTEINT
          - service: light.turn_off
            target:
              entity_id:
                - light.zone_1
                - light.zone_2
                - light.zone_3
                - light.zone_4
                - light.tzb210_1alquo2j_ts0505b_2
                - light.tzb210_1alquo2j_ts0505b_3
                - light.tzb210_1alquo2j_ts0505b_4
                - light.tzb210_1alquo2j_ts0505b_5
                - light.tzb210_1alquo2j_ts0505b_6
                - light.tzb210_1alquo2j_ts0505b_7
                - light.tzb210_1alquo2j_ts0505b_8
                - light.tzb210_1alquo2j_ts0505b_9
                - light.tzb210_1alquo2j_ts0505b_10
                - light.tzb210_1alquo2j_ts0505b_11
                - light.tzb210_1alquo2j_ts0505b_12
                - light.tzb210_1alquo2j_ts0505b_13
                - light.tzb210_1alquo2j_ts0505b_14
                - light.ruban_led
                - light.gros_spot_1
                - light.gros_spot_2
                - light.gros_spot_3
                - light.gros_spot_4
            data:
              transition: 0

          # Attente OFF (utilise l'intervalle configuré)
          - delay:
              seconds: "{{ states('input_number.boost_interval_sec') | float }}"

    - service: input_boolean.turn_off
      entity_id: input_boolean.boost_running
