  - service: light.turn_on
    target: { entity_id: light.zone_2 }
    data:
      brightness_pct: 100
      color_temp: 200                # cold_white_ct

  - service: light.turn_on
    target: { entity_id: light.zone_3 }
    data:
      brightness_pct: 100
      color_temp: 200                # cold_white_ct
