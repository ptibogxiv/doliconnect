sequence:
  - repeat:
      while:
        - condition: state
          entity_id: input_boolean.modeanim_octobrerose
          state: "on"
      sequence:
        - service: light.turn_on
          target: { entity_id: light.zone_1 }
          data: { brightness_pct: 100, rgb_color: [255, 105, 180], transition: 3 }
        - service: light.turn_on
          target: { entity_id: light.zone_2 }
          data: { brightness_pct: 100, rgb_color: [255, 182, 193], transition: 3 }
        - service: light.turn_on
          target: { entity_id: light.zone_3 }
          data: { brightness_pct: 100, rgb_color: [255, 20, 147], transition: 3 }
        - service: light.turn_on
          target: { entity_id: light.zone_4 }
          data: { brightness_pct: 100, rgb_color: [255, 192, 203], transition: 3 }
        - delay: "00:00:05"

        - service: light.turn_on
          target: { entity_id: light.zone_1 }
          data: { brightness_pct: 100, rgb_color: [255, 182, 193], transition: 3 }
        - service: light.turn_on
          target: { entity_id: light.zone_2 }
          data: { brightness_pct: 100, rgb_color: [255, 20, 147], transition: 3 }
        - service: light.turn_on
          target: { entity_id: light.zone_3 }
          data: { brightness_pct: 100, rgb_color: [255, 192, 203], transition: 3 }
        - service: light.turn_on
          target: { entity_id: light.zone_4 }
          data: { brightness_pct: 100, rgb_color: [255, 105, 180], transition: 3 }
        - delay: "00:00:05"
