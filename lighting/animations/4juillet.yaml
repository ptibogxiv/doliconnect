- repeat:
    while:
      - condition: state
        entity_id: input_boolean.modeanim_ia
        state: "on"
    sequence:
      - service: light.turn_on
        target: { entity_id: light.zone_1 }
        data: { brightness_pct: 100, rgb_color: [255, 0, 0], transition: 2 }
      - service: light.turn_on
        target: { entity_id: light.zone_2 }
        data: { brightness_pct: 100, color_temp: 250, transition: 2 }
      - service: light.turn_on
        target: { entity_id: light.zone_3 }
        data: { brightness_pct: 100, rgb_color: [0, 0, 255], transition: 2 }
      - service: light.turn_on
        target: { entity_id: light.zone_4 }
        data: { brightness_pct: 100, rgb_color: [255, 0, 0], transition: 2 }
      - delay: "00:00:02"

      - service: light.turn_on
        target: { entity_id: light.zone_1 }
        data: { brightness_pct: 100, color_temp: 250, transition: 2 }
      - service: light.turn_on
        target: { entity_id: light.zone_4 }
        data: { brightness_pct: 100, rgb_color: [0, 0, 255], transition: 2 }
      - delay: "00:00:02"
